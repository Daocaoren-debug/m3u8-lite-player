name: Fix frameAtTime long literals

on:
  push:
    paths:
      - '.github/workflows/fix-long.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Kotlin source
        run: |
          p='app/src/main/java/com/m3u8/liteplayer/ThumbnailLoader.kt'
          sed -i 's/frameAtTime(0,/frameAtTime(0L,/g; s/frameAtTime(0)/frameAtTime(0L)/g' "$p"
          grep -n frameAtTime "$p"
      - name: Commit patch
        run: |
          git config user.name "WorkBuddy Bot"
          git config user.email "bot@workbuddy.cn"
          git add app/src/main/java/com/m3u8/liteplayer/ThumbnailLoader.kt
          git diff --cached --quiet || git commit -m "Use Long literals for frameAtTime"
          git push
