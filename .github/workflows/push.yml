      - name: Commit sources
        run: |
          git config user.name "WorkBuddy Bot"
          git config user.email "bot@workbuddy.cn"
          git add -A
          git reset -- .github/workflows/push.yml
          git diff --cached --quiet || git commit -m "feat: player rotation + scan cache with incremental scan"
          git push

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon assembleDebug > build-log.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -c 20000 build-log.txt > build-error.txt
            git add build-error.txt
            git commit -m "chore: capture build error [skip ci]"
            git push
            exit $code
          fi
          tail -5 build-log.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M3U8LitePlayer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: M3U8 轻量播放器 v1.1.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
