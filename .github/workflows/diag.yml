name: Diag build log

on:
  push:
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build and capture log
        run: |
          set +e
          gradle --no-daemon assembleDebug > build-log.txt 2>&1
          echo "gradle exit=$?"
          tail -c 30000 build-log.txt > build-error.txt
          wc -c build-error.txt

      - name: Commit log
        run: |
          git config user.name "WorkBuddy Bot"
          git config user.email "bot@workbuddy.cn"
          git add build-error.txt
          git commit -m "chore: capture build log [skip ci]"
          git push
